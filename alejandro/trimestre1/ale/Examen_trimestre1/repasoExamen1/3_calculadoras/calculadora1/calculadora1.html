<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CALCULADORA</title>
    <link rel="stylesheet" href="calculadora1.css">
    <script src="../calculadora1/calculadora1.js"></script>
</head>
<body>

    <h1>CALCULADORA</h1>

    <form id="calcForm">

        <label for="op1">Operador 1</label>
        <input type="text" id="op1" name="op1"><br>

        <label for="op2">Operador 2</label>
        <input type="text" id="op2" name="op2"><br>

        <label>
            <input type="radio" name="operation" value="suma" checked>
            Suma
        </label>

        <label>
            <input type="radio" name="operation" value="resta">
            Resta
        </label>

        <label>
            <input type="radio" name="operation" value="multiplicacion">
            Multiplicacion
        </label>

        <label>
            <input type="radio" name="operation" value="division">
            Division
        </label>

        <button type="button" onclick="calcular()">Calcular</button>
    </form>
</body>
</html>
