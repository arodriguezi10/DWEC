<!DOCTYPE html>
<html lang="es">
<head>

    <title>Perfil de Usuario</title>

        .tarjeta { border: 1px solid #ccc; padding: 1rem; width: 250px; margin-top: 1rem; border-radius: 8px;}
    </style>
</head>
<body>
    <h2>Configurar Perfil</h2>

    <div class="tarjeta" id="tarjetaPerfil">
        <p>No hay datos guardados.</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
