<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Buscador Dinámico</title>
    <style>
        .tarjeta { border: 1px solid #ccc; padding: 1rem; width: 200px; text-align: center; border-radius: 8px;}
        .error { color: red; font-weight: bold; }
    </style>
</head>
<body>
    <h2>Buscador de Datos</h2>
    <input type="text" id="inputBusqueda" placeholder="Ej: pikachu, ditto, mew...">
    <button id="btnBuscar">Buscar</button>

    <div class="tarjeta" id="contenedorResultado">
        <p>Escribe un nombre para buscar.</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
