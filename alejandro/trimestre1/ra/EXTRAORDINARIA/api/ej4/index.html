<html lang="es">

    <title>Perfil Dinámico</title>

        .perfil img { border-radius: 50%; width: 128px; height: 128px; }

</head>
<body>
    <div class="perfil">

    </div>
    <br>
    <button id="btnGenerarPerfil">Generar Nuevo Usuario</button>

    <script src="script.js"></script>
</body>
</html>
