<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Examen Final Combinado</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2rem; }
        .panel { border: 1px solid #ccc; padding: 1rem; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <h1>Panel de Gestión de Usuarios</h1>

    <div class="panel">
        <h2>Mi Contacto Favorito</h2>
        <p>Favorito actual: <strong id="favoritoMostrado">Ninguno</strong></p>
        
        <input type="text" id="inputFavorito" placeholder="Escribe un nombre...">
        <button id="btnGuardar">Guardar Favorito</button>
    </div>

    <div class="panel">
        <h2>Directorio General</h2>
        <button id="btnCargar">Cargar Lista desde la API</button>
        
        <div id="contenedorUsuarios">
            <p>Haz clic para cargar los usuarios.</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
